name: Build Android (Godot 4)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -o -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Run tests
        run: ~/godot/godot --headless --path . --script tests/run_tests.gd

  build:
    name: Export APK / AAB
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -o -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          TEMPL=$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TEMPL"
          unzip -o -q /tmp/templates.tpz -d "$TEMPL"
          if [ -d "$TEMPL/templates" ]; then mv "$TEMPL/templates/"* "$TEMPL"/ && rmdir "$TEMPL/templates"; fi
          rm -f /tmp/templates.tpz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;23.2.8568313" > /dev/null

      - name: Configure Godot editor settings for Android
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export debug APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android APK" build/nonograms-debug.apk
          ls -la build

      - name: Export release APK (signed)
        if: steps.keystore.outputs.present == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ~/godot/godot --headless --path . --export-release "Android APK" build/nonograms-release.apk
          ls -la build

      - name: Export release AAB (signed, Gradle build)
        if: steps.keystore.outputs.present == 'true'
        continue-on-error: true
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Gradle build needs the Android build template unpacked into android/build.
          ~/godot/godot --headless --path . --install-android-build-template
          ~/godot/godot --headless --path . --export-release "Android AAB" build/nonograms-release.aab
          ls -la build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nonograms-android
          path: |
            build/*.apk
            build/*.aab
          if-no-files-found: error
